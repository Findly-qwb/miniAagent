name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: 安装依赖（后端 + 前端）
        run: npm ci && npm --prefix web ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建后端
        run: npm run build

      - name: 构建前端
        run: npm --prefix web run build
