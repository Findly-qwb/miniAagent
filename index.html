<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0dd">
  <title>鹈鹕的海岸骑行</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Avenir Next", Avenir, "Noto Sans SC", "PingFang SC", sans-serif;
      background: #f5f0dd;
      color: #263a3a;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

    .scene {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 600px;
      overflow: hidden;
      background: #f5f0dd;
      isolation: isolate;
    }

    .scene-art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .masthead {
      position: absolute;
      z-index: 2;
      top: clamp(28px, 6.5vh, 68px);
      left: clamp(24px, 7vw, 100px);
      pointer-events: none;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 12px;
      color: #477c73;
      font-size: 11px;
      font-weight: 700;
      line-height: 1;
    }

    .eyebrow::before {
      width: 22px;
      height: 2px;
      background: #e77f59;
      content: "";
    }

    h1 {
      max-width: 500px;
      margin: 0;
      color: #273c3a;
      font-family: "Iowan Old Style", "Songti SC", "Noto Serif SC", serif;
      font-size: clamp(31px, 4vw, 54px);
      font-weight: 600;
      line-height: 1.16;
      letter-spacing: 0;
    }

    .ride-note {
      position: absolute;
      z-index: 2;
      top: clamp(34px, 7vh, 74px);
      right: clamp(22px, 6vw, 88px);
      display: flex;
      align-items: center;
      gap: 9px;
      color: #56726b;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0;
    }

    .ride-note .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e77f59;
      box-shadow: 0 0 0 4px rgb(231 127 89 / 16%);
    }

    .motion-toggle {
      position: absolute;
      z-index: 3;
      right: clamp(20px, 4vw, 54px);
      bottom: clamp(20px, 4vh, 40px);
      display: grid;
      width: 48px;
      height: 48px;
      place-items: center;
      padding: 0;
      border: 1px solid rgb(39 60 58 / 16%);
      border-radius: 50%;
      background: #fffdf4;
      color: #273c3a;
      cursor: pointer;
      box-shadow: 0 5px 16px rgb(42 58 53 / 11%);
      transition: transform 180ms ease, background-color 180ms ease;
    }

    .motion-toggle:hover { transform: translateY(-2px); background: #fff; }
    .motion-toggle:focus-visible { outline: 3px solid #e77f59; outline-offset: 3px; }
    .motion-toggle svg { width: 19px; height: 19px; }
    .motion-toggle .play-icon { display: none; }
    .motion-toggle[aria-pressed="true"] .pause-icon { display: none; }
    .motion-toggle[aria-pressed="true"] .play-icon { display: block; }

    .paused .spokes,
    .paused .cloud-motion,
    .paused .water-motion,
    .paused .bird-bob,
    .paused .scarf-motion,
    .paused .grass-motion {
      animation-play-state: paused !important;
    }

    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes drift { 50% { transform: translateX(18px); } }
    @keyframes ripple { 50% { transform: translateX(24px); } }
    @keyframes bob { 50% { transform: translateY(5px); } }
    @keyframes flutter { 50% { transform: rotate(-7deg); } }
    @keyframes sway { 50% { transform: translateY(-4px); } }

    .spokes {
      transform-box: view-box;
      transform-origin: center;
      animation: rotate 2.5s linear infinite;
    }
    .rear-spokes { transform-origin: 505px 650px; }
    .front-spokes { transform-origin: 925px 650px; }
    .cloud-motion { animation: drift 11s ease-in-out infinite alternate; }
    .cloud-motion.slower { animation-duration: 16s; animation-direction: alternate-reverse; }
    .water-motion { animation: ripple 5s ease-in-out infinite alternate; }
    .bird-bob { transform-box: view-box; transform-origin: 718px 417px; animation: bob 1.1s ease-in-out infinite; }
    .scarf-motion { transform-box: view-box; transform-origin: 756px 306px; animation: flutter 0.6s ease-in-out infinite alternate; }
    .grass-motion { animation: sway 2s ease-in-out infinite alternate; transform-box: view-box; transform-origin: center bottom; }

    @media (max-width: 640px) {
      .scene { min-height: 100svh; }
      .scene-art {
        inset: auto auto 0 50%;
        width: min(900px, 230vw);
        height: auto;
        transform: translateX(-50%);
      }
      .masthead { top: 30px; left: 24px; }
      .eyebrow { margin-bottom: 9px; font-size: 10px; }
      h1 { max-width: 300px; font-size: 33px; }
      .ride-note { top: 36px; right: 22px; gap: 7px; font-size: 9px; }
      .ride-note .dot { width: 7px; height: 7px; }
      .motion-toggle { right: 18px; bottom: 18px; width: 44px; height: 44px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; }
    }
  </style>
</head>

    <header class="masthead">

    <div class="ride-note"><span class="dot" aria-hidden="true"></span><span>海风正好</span></div>
    <button class="motion-toggle" id="motion-toggle" type="button" aria-label="暂停动画" aria-pressed="false" title="暂停动画">

      <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.8c0-.8.9-1.3 1.6-.9l9.2 5.7c.7.4.7 1.4 0 1.8l-9.2 5.7c-.7.4-1.6-.1-1.6-.9z" /></svg>

  <script>
    const svg = document.getElementById("illustration");
    const button = document.getElementById("motion-toggle");
    const scene = document.getElementById("scene");
    const legs = [
      { line: document.getElementById("far-leg"), outline: document.getElementById("far-leg-outline"), foot: document.getElementById("far-foot"), footOutline: document.getElementById("far-foot-outline"), hip: [700, 455], phase: 0 },
      { line: document.getElementById("near-leg"), outline: document.getElementById("near-leg-outline"), foot: document.getElementById("near-foot"), footOutline: document.getElementById("near-foot-outline"), hip: [733, 455], phase: Math.PI }
    ];
    let paused = false;
    let lastTime = 0;

    function pedal(time) {
      if (!paused) {
        const angle = time * 0.0055;
        legs.forEach((leg) => {
          const a = angle + leg.phase;
          const footX = 720 + Math.cos(a) * 24;
          const footY = 650 + Math.sin(a) * 24;
          const kneeX = (leg.hip[0] + footX) / 2 + Math.sin(a) * 26;
          const kneeY = (leg.hip[1] + footY) / 2 + Math.cos(a) * 14;
          const path = `M${leg.hip[0]} ${leg.hip[1]} Q${kneeX.toFixed(1)} ${kneeY.toFixed(1)} ${footX.toFixed(1)} ${footY.toFixed(1)}`;
          const shoe = `M${footX.toFixed(1)} ${footY.toFixed(1)} l22 0`;
          leg.line.setAttribute("d", path);
          leg.outline.setAttribute("d", path);
          leg.foot.setAttribute("d", shoe);
          leg.footOutline.setAttribute("d", shoe);
        });
        lastTime = time;
      }
      requestAnimationFrame(pedal);
    }

    button.addEventListener("click", () => {
      paused = !paused;
      scene.classList.toggle("paused", paused);
      if (paused) svg.pauseAnimations();
      else {
        svg.unpauseAnimations();
        requestAnimationFrame(pedal);
      }
      button.setAttribute("aria-pressed", String(paused));
      button.setAttribute("aria-label", paused ? "继续动画" : "暂停动画");
      button.setAttribute("title", paused ? "继续动画" : "暂停动画");
    });

    requestAnimationFrame(pedal);
  </script>
